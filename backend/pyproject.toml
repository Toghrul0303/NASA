[project]
name = "spherex-backend"
version = "1.0.0"
description = "SPHEREx Sky Explorer backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "typer",
  "numpy",
  "scipy",
  "astropy",
  "astroquery",
  "pyvo",
  "photutils",
  "reproject",
  "pillow",
  "jsonschema",
  "referencing",
  "filelock",
  "pyyaml",
  "fsspec>=2026.9.0",
  "aiohttp>=3.14.5",
]

[project.scripts]
spherex = "spherex_backend.cli:app"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "ruff",
  "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/spherex_backend/contract_check.py" = ["E501"]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
packages = ["spherex_backend"]
strict = true
